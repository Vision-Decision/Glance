[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance"
version = "0.2.0"
description = "Calibrated typed decisions (box / choice / yes-no / score) about an image or text in one forward pass"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=5.9",
  "peft>=0.15",
  "pillow",
  "safetensors",
  "huggingface_hub",
  "torchvision",
]

[project.optional-dependencies]
fla = ["flash-linear-attention"]
demo = ["matplotlib", "numpy"]

[project.urls]
Homepage = "https://github.com/Vision-Decision/Glance"
Weights = "https://huggingface.co/Vision-Decision/Glance-4B-preview"

[tool.setuptools]
packages = ["glance"]
